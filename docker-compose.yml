services:
  postgres:
    image: postgres:16-alpine
    container_name: meupaciente-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meupaciente
      POSTGRES_PASSWORD: meupaciente
      POSTGRES_DB: meupaciente
    ports:
      - "5432:5432"
    volumes:
      - meupaciente_pgdata:/var/lib/postgresql/data

  # Caixa de entrada local: recebe o e-mail enviado por SMTP sem entregar a ninguém.
  # Use SMTP_HOST=localhost e SMTP_PORT=1025; as mensagens aparecem em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1
    container_name: meupaciente-mail
    restart: unless-stopped
    environment:
      # Aceita qualquer usuário e senha, sem TLS: só serve para o desenvolvimento.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  meupaciente_pgdata:
